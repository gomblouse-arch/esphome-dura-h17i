# Zwembadchemie-monitor (aparte ESP32 naast Dura-H17i)
# Meet: pH + ORP (chloor-proxy) + watertemperatuur via ADS1115
#
# Bedrading (ESP32 DevKit V1):
#   ADS1115 VDD -> 3.3V
#   ADS1115 GND -> GND
#   ADS1115 SDA -> GPIO21
#   ADS1115 SCL -> GPIO22
#   pH-board V+ -> 5V (USB/VIN), GND -> GND, Po -> ADS1115 A0
#   ORP-board V+ -> 5V, GND -> GND, Po -> ADS1115 A1
#   DS18B20 VDD -> 3.3V, GND -> GND, DATA -> GPIO4 (+ 4.7k pull-up naar 3.3V)
#
# Kalibratie:
#   1) Zet pH-probe in buffer 7.0, noteer "pH raw voltage", vul in number ph_cal_7v
#   2) Zet pH-probe in buffer 4.0, noteer voltage, vul in number ph_cal_4v
#   3) Zet ORP-probe in 225 mV oplossing, noteer "ORP raw voltage", vul offset bij orp_offset_mv

substitutions:
  device_name: zwembad-chemie
  friendly_name: Zwembad Chemie

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name}-setup"
    password: !secret ota_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

ads1115:
  - address: 0x48
    id: ads1115_hub

one_wire:
  - platform: gpio
    pin: GPIO4

# Kalibratiepunten (pas aan na meten met buffers)
number:
  - platform: template
    name: "pH cal 7.0 voltage"
    id: ph_cal_7v
    icon: mdi:flask
    entity_category: config
    min_value: 0.5
    max_value: 4.5
    step: 0.001
    initial_value: 2.500
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "pH cal 4.0 voltage"
    id: ph_cal_4v
    icon: mdi:flask
    entity_category: config
    min_value: 0.5
    max_value: 4.5
    step: 0.001
    initial_value: 3.000
    optimistic: true
    restore_value: true
    unit_of_measurement: "V"

  - platform: template
    name: "ORP offset mV"
    id: orp_offset_mv
    icon: mdi:tune
    entity_category: config
    min_value: -500
    max_value: 500
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "mV"

sensor:
  - platform: dallas_temp
    name: "Watertemperatuur"
    id: water_temp
    update_interval: 30s
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  # Ruwe pH-spanning (voor kalibratie)
  - platform: ads1115
    ads1115_id: ads1115_hub
    multiplexer: A0_GND
    gain: 6.144
    name: "pH raw voltage"
    id: ph_raw_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 5s
    entity_category: diagnostic
    filters:
      - median:
          window_size: 7
          send_every: 3
          send_first_at: 1

  # Gekalibreerde pH (2-punts: 4.0 en 7.0)
  - platform: template
    name: "pH"
    id: pool_ph
    unit_of_measurement: "pH"
    icon: mdi:ph
    device_class: ph
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      float v = id(ph_raw_v).state;
      float v7 = id(ph_cal_7v).state;
      float v4 = id(ph_cal_4v).state;
      if (isnan(v) || isnan(v7) || isnan(v4) || abs(v7 - v4) < 0.01) {
        return NAN;
      }
      // Lineair: pH = 7 + (v7 - v) * (7-4)/(v7-v4)
      return 7.0f + (v7 - v) * (3.0f / (v7 - v4));
    filters:
      - clamp:
          min_value: 0.0
          max_value: 14.0
      - heartbeat: 60s

  # Ruwe ORP-spanning
  - platform: ads1115
    ads1115_id: ads1115_hub
    multiplexer: A1_GND
    gain: 6.144
    name: "ORP raw voltage"
    id: orp_raw_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 5s
    entity_category: diagnostic
    filters:
      - median:
          window_size: 7
          send_every: 3
          send_first_at: 1

  # ORP in mV (Gravity ORP: vaak ~ midpoint 2.5V = 0 mV; schaal ~ ±2000 mV over 0-5V)
  # Pas schaal/offset aan na kalibratie met 225 mV oplossing.
  - platform: template
    name: "ORP"
    id: pool_orp
    unit_of_measurement: "mV"
    icon: mdi:water-check
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 15s
    lambda: |-
      float v = id(orp_raw_v).state;
      if (isnan(v)) {
        return NAN;
      }
      // DFRobot Gravity ORP (typisch): ORP(mV) = (2.5 - V) / 1.037 * 1000
      float orp = ((2.5f - v) / 1.037f) * 1000.0f;
      return orp + id(orp_offset_mv).state;
    filters:
      - heartbeat: 60s

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
    ssid:
      name: "SSID"

button:
  - platform: restart
    name: "Herstart"
